# Verifies pull requests. Production deploys come from Cloudflare Workers Builds
# (Git integration), not from this workflow, so no Cloudflare token is needed here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Validate HTML
        run: pnpm validate

      - name: Wrangler dry run
        run: pnpm deploy:dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

      # Mobile Lighthouse against dist/; fails the job if any category < 95.
      # Reports are kept as a workflow artifact, not uploaded to a public server.
      - name: Lighthouse CI
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
